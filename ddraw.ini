; cnc-ddraw configuration for Dragon Throne: Battle of Red Cliffs on Apple Silicon.
; Place this next to dragonthrone.exe, together with cnc-ddraw's ddraw.dll.
; GDI renderer = pure CPU 2D blitting, independent of the (broken) Apple GL path.
[ddraw]
fullscreen=false
windowed=true
maintas=true
adjmouse=true
renderer=gdi
; maxgameticks caps the engine tick rate (this engine ties speed to CPU clock);
; 30 keeps the game at a sane speed. limiter_type=2 = more accurate limiter.
maxgameticks=30
limiter_type=2
noactivateapp=true
no_dinput_hook=true

; Per-executable overrides (the engine has been seen under these internal names).
[dragonthrone]
maxgameticks=30
limiter_type=2
noactivateapp=true
no_dinput_hook=true

[AdSanguo]
maxgameticks=30
limiter_type=2
noactivateapp=true
no_dinput_hook=true
